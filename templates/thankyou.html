<!DOCTYPE html>
<html>
<head>

    <title>Thank You</title>

    <meta http-equiv="refresh" content="4;url=/login/">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            color:white;
            font-family:Arial;
            background:black;
        }

        .bg{
            position:fixed;
            width:100%;
            height:100%;
            top:0;
            left:0;
            z-index:-1;
        }

        .bg img{
            position:absolute;
            width:100%;
            height:100%;
            object-fit:cover;
            opacity:0;
            animation:slide 16s infinite;
        }

        .bg img:nth-child(1){
            animation-delay:0s;
        }

        .bg img:nth-child(2){
            animation-delay:4s;
        }

        .bg img:nth-child(3){
            animation-delay:8s;
        }

        .bg img:nth-child(4){
            animation-delay:12s;
        }

        @keyframes slide{
            0%{opacity:0;}
            10%{opacity:1;}
            30%{opacity:1;}
            40%{opacity:0;}
            100%{opacity:0;}
        }

        .box{
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(15px);
            border-radius:25px;
            padding:50px;
            text-align:center;
            box-shadow:0 8px 40px rgba(0,0,0,0.4);
        }

        h1{
            font-size:50px;
        }

    </style>

</head>

<body>

<div class="bg">

<img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
<img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3">
<img src="https://images.unsplash.com/photo-1484417894907-623942c8ee29">
<img src="https://images.unsplash.com/photo-1518770660439-4636190af475">

</div>

<div class="box">

    <h1>👋 Thank You</h1>

    <h3>
        Logged Out Successfully
    </h3>

    <p>
        Redirecting To Login Page...
    </p>

</div>

</body>
</html>
