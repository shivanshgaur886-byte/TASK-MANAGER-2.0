<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            height:100vh;
            overflow:hidden;
            font-family:Arial;
        }

        .bg-slideshow{
            position:fixed;
            width:100%;
            height:100%;
            top:0;
            left:0;
            z-index:-1;
        }

        .bg-slideshow img{
            position:absolute;
            width:100%;
            height:100%;
            object-fit:cover;
            opacity:0;
            animation:slide 20s infinite;
        }

        .bg-slideshow img:nth-child(1){
            animation-delay:0s;
        }

        .bg-slideshow img:nth-child(2){
            animation-delay:5s;
        }

        .bg-slideshow img:nth-child(3){
            animation-delay:10s;
        }

        .bg-slideshow img:nth-child(4){
            animation-delay:15s;
        }

        @keyframes slide{
            0%{opacity:0;}
            10%{opacity:1;}
            25%{opacity:1;}
            35%{opacity:0;}
            100%{opacity:0;}
        }

        .glass-card{
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(15px);
            border-radius:25px;
            padding:40px;
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            color:white;
        }

    </style>
</head>

<body>

<div class="bg-slideshow">

    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
    <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3">
    <img src="https://images.unsplash.com/photo-1484417894907-623942c8ee29">
    <img src="https://images.unsplash.com/photo-1518770660439-4636190af475">

</div>

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-4">

            <div class="glass-card">

                <h1 class="text-center mb-4">
                    Welcome Back 🚀
                </h1>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <input
                        type="text"
                        name="username"
                        class="form-control mb-3"
                        placeholder="Username"
                        required
                    >

                    <input
                        type="password"
                        name="password"
                        class="form-control mb-3"
                        placeholder="Password"
                        required
                    >

                    <button
                        class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

                <div class="text-center mt-3">

                    No account?

                    <a href="{% url 'register' %}"
                       class="text-warning">

                        Register

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
