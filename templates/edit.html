<!DOCTYPE html>
<html>
<head>

    <title>Edit Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg rounded-4">

                <div class="card-body p-5">

                    <h1 class="text-center mb-4">
                        Edit Task ✏️
                    </h1>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Task Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                value="{{ task.title }}"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                            >{{ task.description }}</textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-4">

                                <label class="form-label">
                                    Deadline
                                </label>

                                <input
                                    type="date"
                                    name="deadline"
                                    value="{{ task.deadline|date:'Y-m-d' }}"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <div class="col-md-4">

                                <label class="form-label">
                                    Status
                                </label>

                                <select
                                    name="status"
                                    class="form-control">

                                    <option value="Pending"
                                    {% if task.status == 'Pending' %}
                                    selected
                                    {% endif %}
                                    >
                                        Pending
                                    </option>

                                    <option value="Completed"
                                    {% if task.status == 'Completed' %}
                                    selected
                                    {% endif %}
                                    >
                                        Completed
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-4">

                                <label class="form-label">
                                    Priority
                                </label>

                                <select
                                    name="priority"
                                    class="form-control">

                                    <option value="Low"
                                    {% if task.priority == 'Low' %}
                                    selected
                                    {% endif %}
                                    >
                                        Low
                                    </option>

                                    <option value="Medium"
                                    {% if task.priority == 'Medium' %}
                                    selected
                                    {% endif %}
                                    >
                                        Medium
                                    </option>

                                    <option value="High"
                                    {% if task.priority == 'High' %}
                                    selected
                                    {% endif %}
                                    >
                                        High
                                    </option>

                                </select>

                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success mt-4 w-100">

                            Update Task

                        </button>

                        <a href="{% url 'home' %}"
                           class="btn btn-secondary mt-3 w-100">

                           Back To Dashboard

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
